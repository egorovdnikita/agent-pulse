<!-- Скрытый UI: единственное место плагина, откуда разрешена сеть. Пересылает сообщения в Agent Pulse. -->
<script>
  const ENDPOINT = "http://localhost:47811/figma";

  onmessage = async (event) => {
    const message = event.data && event.data.pluginMessage;
    if (!message) return;
    try {
      const response = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(message),
      });
      if (message.kind === "change" && response.ok) {
        const reply = await response.json();
        parent.postMessage({ pluginMessage: { type: "mirror", value: Boolean(reply.mirror) } }, "*");
      }
    } catch (error) {
      // Agent Pulse не запущен — плагин работает дальше, ничего не ломая.
    }
  };
</script>
